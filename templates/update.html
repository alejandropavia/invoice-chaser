<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Actualizar archivo — Invoice Chaser</title>
  <style>
    :root{--bg:#0b1020;--card:#0f172a;--muted:#9aa4b2;--text:#e6eaf2;--line:rgba(255,255,255,.12);--accent:#6ee7b7}
    *{box-sizing:border-box}
    body{margin:0;font-family:ui-sans-serif,system-ui;background:var(--bg);color:var(--text)}
    .wrap{max-width:900px;margin:0 auto;padding:40px 20px}
    .card{background:rgba(15,23,42,.85);border:1px solid var(--line);border-radius:18px;padding:22px}
    h1{margin:0 0 10px;font-size:22px}
    .mini{font-size:12px;color:var(--muted);margin-top:6px}
    .file{
      border:1px dashed var(--line);
      padding:12px;
      border-radius:14px;
      background:rgba(2,6,23,.25);
      margin:14px 0;
    }
    input[type=file]{width:100%;color:var(--muted)}
    .btn{
      margin-top:18px;
      appearance:none;
      border:0;
      cursor:pointer;
      padding:12px 16px;
      border-radius:14px;
      font-weight:650;
      background:linear-gradient(180deg, rgba(110,231,183,.95), rgba(110,231,183,.75));
      color:#071018;
    }
    a{color:var(--accent);text-decoration:none}
    .notice{
      margin-top:12px;
      border:1px solid var(--line);
      background:rgba(2,6,23,.25);
      padding:12px 14px;
      border-radius:14px;
      color:var(--muted);
      font-size:12px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Actualizar archivo</h1>
      <p class="mini">
        Sube una nueva versión del Excel/CSV para recalcular impagos y detener recordatorios si un cliente ya pagó.
      </p>

      <form action="/update-upload" method="post" enctype="multipart/form-data">
        <input type="hidden" name="token" value="{{ token }}">
        <div class="file">
          <input type="file" name="file" accept=".xlsx,.xls,.csv" required>
        </div>
        <button class="btn" type="submit">Actualizar y recalcular</button>
      </form>

      <div class="notice">
        Si faltan columnas, te pediremos volver a seleccionar las columnas (solo en ese caso).
      </div>

      <p class="mini" style="margin-top:20px;">
        <a href="/panel">← Volver al panel</a>
      </p>
    </div>
  </div>
</body>
</html>
